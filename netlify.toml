# Netlify Configuration for Atelier Aura Luxury Interior Studio

[build]
  publish = "."
  command = "echo 'Static build ready'"

# SPA / Fallback redirects so any route cleanly serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
